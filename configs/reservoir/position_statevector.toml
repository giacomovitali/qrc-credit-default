# Position encoding, statevector backend with exact readout times
#. CARDS_1000 only (1,000 samples; the paper runs the full set with detuning only).
#
#   julia --project=. -t 28 quantum_evolution/run_reservoir.jl configs/reservoir/position_statevector.toml

encoding = "position"
backend = "statevector"
readout_timing = "exact"
input_dir = "dataset_aquila"
sets = ["qpu_samples_pos"]
scale_reference = "qpu_samples"   # same scaling as the hardware runs (identical ranges)
output_dir = "results/emulation"

[layer]
t_start = 0.0
t_end = 2.5
step = 0.5
omega = 6.283185307179586   # 2π
scale = 10.0
delta = 2.0
lambda = 1.0
